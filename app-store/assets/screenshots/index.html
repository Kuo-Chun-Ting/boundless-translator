<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>功能介紹圖：截圖素材 review</title><style>body{max-width:1400px;margin:32px auto;padding:0 24px;background:#f4f5f7;color:#222;font:17px/1.6 system-ui}nav{display:flex;gap:20px;flex-wrap:wrap}a{color:#155ca2}figure{margin:42px 0 60px}figcaption{margin-bottom:14px}strong{font-size:22px}img{display:block;max-width:100%;height:auto;border:1px solid #ccc}small{color:#555}</style><h1>功能介紹圖：截圖素材</h1><p>五張 PNG 取自 2026-10-20 重錄版本（選字 16:11、菜單 15:59），尺寸 3024 × 1964；菜單字典使用補拍的 1612 × 1408 PNG。僅菜單原圖移除游標，選字翻譯保留句子旁的游標，其餘操作圖也保留。另保留 Settings 原始截圖。此處展示原始素材，字典保留原始內容。點圖片可看原尺寸。</p><nav><a href="#selected">1. 選字翻譯</a><a href="#menu-source">2. 菜單原圖</a><a href="#menu-hover">3. 單字翻譯</a><a href="#menu-phrase">4. 整段翻譯</a><a href="#selected-dictionary">5. 選字後查字典</a><a href="#menu-dictionary">6. 截圖後查字典</a><a href="#settings">7. Settings</a></nav><figure id="selected"><figcaption><strong>1. 選字翻譯</strong><br>PDF 的反白句子與完整譯文。<br><small>selected-text-translation.mov · 4.3 秒 · <a href="selected.png">原尺寸 PNG</a></small></figcaption><a href="selected.png"><img src="selected.png" alt="選字翻譯"></a></figure><figure id="menu-source"><figcaption><strong>2. 菜單原圖</strong><br>作為截圖翻譯頁的背景原圖。<br><small>screenshot-translation.mov · 0.5 秒 · <a href="menu-source.png">原尺寸 PNG</a></small></figcaption><a href="menu-source.png"><img src="menu-source.png" alt="菜單原圖"></a></figure><figure id="menu-hover"><figcaption><strong>3. 單字翻譯</strong><br>「香ばしく」反白及「香氣十足的」翻譯字卡。<br><small>screenshot-translation.mov · 13.3 秒 · <a href="menu-hover.png">原尺寸 PNG</a></small></figcaption><a href="menu-hover.png"><img src="menu-hover.png" alt="單字翻譯"></a></figure><figure id="menu-phrase"><figcaption><strong>4. 整段翻譯</strong><br>菜單說明整段反白及繁中翻譯字卡。<br><small>screenshot-translation.mov · 11.3 秒 · <a href="menu-phrase.png">原尺寸 PNG</a></small></figcaption><a href="menu-phrase.png"><img src="menu-phrase.png" alt="整段翻譯"></a></figure><figure id="selected-dictionary"><figcaption><strong>5. 選字後查字典</strong>
