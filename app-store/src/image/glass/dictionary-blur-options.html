<script>
// Seeded light motes: dense near the centre, thinning toward the edges like settling dust.
(function () {
  function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function gauss(r) { var u = 1 - r(), v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
  var colours = [[255, 241, 207], [244, 206, 133], [228, 172, 74], [255, 236, 195]];
  document.querySelectorAll('canvas.dust').forEach(function (canvas) {
    var w = +canvas.dataset.w, h = +canvas.dataset.h, pad = +canvas.dataset.pad, dpr = window.devicePixelRatio || 1;
    canvas.width = w * dpr; canvas.height = h * dpr;
    var c = canvas.getContext('2d'); c.scale(dpr, dpr);
    var r = rng(+canvas.dataset.seed);
    var mist = c.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, Math.max(w, h) * .55);
    mist.addColorStop(0, 'rgba(255,248,232,.72)'); mist.addColorStop(.55, 'rgba(255,242,214,.3)'); mist.addColorStop(1, 'rgba(255,240,205,0)');
    c.fillStyle = mist; c.fillRect(0, 0, w, h);
    for (var i = 0; i < 760; i++) {
      var px = w / 2 + gauss(r) * (w - pad * 2) * .3, py = h / 2 + gauss(r) * h * .24;
      if (px < 2 || py < 3 || px > w - 2 || py > h - 3) continue;
      var size = .3 + Math.pow(r(), 3) * 1.5, col = colours[Math.floor(r() * colours.length)], a = .25 + r() * .6;
      c.save();
      if (r() < .1) { c.shadowColor = 'rgba(237,171,63,.75)'; c.shadowBlur = 5; a = Math.min(1, a + .3); size += .5; }
      c.fillStyle = 'rgba(' + col.join(',') + ',' + a.toFixed(2) + ')';
      c.beginPath(); c.arc(px, py, size, 0, Math.PI * 2); c.fill(); c.restore();
    }
  });
})();
</script>
